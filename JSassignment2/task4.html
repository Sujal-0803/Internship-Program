<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sum of Products</title>
    <style>
        body{
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
            padding: 30px;
        }

        h1{
            color: #333;
        }

        input{
            padding: 10px;
            width: 220px;
            font-size: 16px;
            margin: 10px;
        }

        button{
            padding: 10px 20px;
            font-size: 18px;
            background-color: green;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover{
            background-color: darkgreen;
        }

        #output{
            background-color: white;
            width: 60%;
            margin: 20px auto;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 2px 5px rgba(0,0,0,0.2);
            font-size: 24px;
        }
    </style>

    <script>
        function sumOfProducts(){
            let n1 = Number(document.getElementById("num1").value);
            let n2 = Number(document.getElementById("num2").value);
            let sum = 0;
            while(n1 > 0 || n2 > 0){
                let digit1 = n1 % 10;
                let digit2 = n2 % 10;

                sum += digit1 * digit2;

                n1 = Math.floor(n1 / 10);
                n2 = Math.floor(n2 / 10);
            }
            document.getElementById("output").innerHTML = "Sum of Products = " + sum;
        }
    </script>
</head>

<body>
    <h1>Sum of Products of Corresponding Digits</h1>
    <input type="text" id="num1" placeholder="Enter First Number">
    <input type="text" id="num2" placeholder="Enter Second Number">

    <br>

    <button onclick="sumOfProducts()">
        Calculate
    </button>
    <div id="output"></div>
</body>

</html>
